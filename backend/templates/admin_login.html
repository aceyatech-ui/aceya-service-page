<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login · Aceya Systems</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0D0F0E;
      color: #F3F1E8;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-box {
      background: #191C1A;
      border: 1px solid #2A2D2B;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
    }

    .login-box h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: #F3F1E8;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .login-box .subtitle {
      color: #9A9D98;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .login-box .accent {
      color: #B7F34A;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #F3F1E8;
      margin-bottom: 0.3rem;
    }

    .form-group input {
      width: 100%;
      background: #0D0F0E;
      border: 1px solid #2A2D2B;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: #F3F1E8;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #B7F34A;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      background: #B7F34A;
      color: #0D0F0E;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(183, 243, 74, 0.25);
    }

    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #EF4444;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .footer-text {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6F726E;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>ACEYA <span class="accent">SYSTEMS</span></h1>
    <p class="subtitle">Admin · review management</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn">Log in</button>
    </form>

    <p class="footer-text">/// aceya-systems admin</p>
  </div>

</body>
</html>
